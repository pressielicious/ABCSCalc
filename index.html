<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #111;
    border-bottom: 1px solid #333;
    padding: 15px 10px;
    text-align: center;
}

.site-logo {
    display: block;
    width: min(320px, 80vw);
    height: auto;
    max-height: 90px;
    margin: 0 auto 8px;
    object-fit: contain;
}

.container {
    width: min(1400px, 96%);
    margin: auto;
    padding: 25px 0 60px;
}

h1, h2, h3 {
    margin-top: 0;
}

.section-title {
    text-align: center;
    margin: 15px 0 25px;
    font-size: 28px;
}

.groups {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.group-card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
}

.group-card.confirmed {
    border-color: #5a0000;
}

.group-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.team-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 270px;
}

.team-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #222;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 11px 12px;
    cursor: grab;
    user-select: none;
    transition: .15s;
}

.team-item:hover {
    background: #2c2c2c;
}

.team-item.dragging {
    opacity: .4;
}

.team-rank {
    width: 30px;
    font-weight: bold;
    color: #aaa;
}

.team-name {
    flex: 1;
    font-weight: bold;
}

.qualified-mark {
    color: #58d68d;
    font-size: 12px;
}

.group-actions {
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 15px;
    font-weight: bold;
    cursor: pointer;
}

.confirm-btn {
    width: 100%;
    background: #5a0000;
    color: white;
}

.confirm-btn:hover {
    background: #780000;
}

.confirm-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.build-wrap {
    text-align: center;
    margin: 30px 0;
}

.build-btn {
    background: #fff;
    color: #000;
    font-size: 17px;
    padding: 13px 28px;
}

.build-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* QUALIFIED */

.qualified-section {
    margin-top: 35px;
}

.qualified-card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
}

.qualified-groups {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.qualified-group {
    background: #202020;
    border-radius: 9px;
    padding: 15px;
}

.qualified-group h3 {
    margin-bottom: 12px;
}

.qualified-team {
    padding: 8px 0;
    border-bottom: 1px solid #333;
}

.qualified-team:last-child {
    border-bottom: 0;
}

/* BRACKET */

.bracket-section {
    margin-top: 50px;
}

.bracket-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 25px;
}

}

.match-card.locked {

.match-id {

    color: #58d68d;

.match-team.loser {

}

.win-label {

.undo-btn {

    color: #fff;

.undo-btn:hover {
    background: #555;
}

/* GRAND FINAL */

.grand-final {
    margin-top: 25px;
}

.grand-final .match-card {
    max-width: 600px;
    margin: auto;
}

/* PLACEMENT */

.placement-section {
    margin-top: 45px;
}

.placement-card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 22px;
}

.placement-card h2 {
    text-align: center;
    margin-bottom: 5px;
}

.placement-subtitle {
    text-align: center;
    color: #999;
    margin-top: 0;
    margin-bottom: 20px;
}

.placement-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.placement-row {
    display: grid;
    grid-template-columns: 70px 1fr 150px;
    align-items: center;
    background: #202020;
    border: 1px solid #303030;
    border-radius: 8px;
    padding: 12px 14px;
}

.placement-rank {
    font-weight: bold;
}

.placement-team {
    font-weight: bold;
}

.placement-source {
    text-align: right;
    color: #888;
    font-size: 12px;
}

.placement-row.champion {
    border-color: #b89632;
    background: #292411;
}

.placement-row.second {
    border-color: #777;
}

.placement-row.third {
    border-color: #7c4f2e;
}

.placement-empty {
    text-align: center;
    color: #777;
    padding: 25px;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .groups {
        grid-template-columns: 1fr;
    }

    .qualified-groups {
        grid-template-columns: repeat(2, 1fr);
    }

    .bracket-area {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .container {
        width: 94%;
    }

    .section-title {
        font-size: 24px;
    }

    .qualified-groups {
        grid-template-columns: 1fr;
    }

    .placement-row {
        grid-template-columns: 55px 1fr;
        gap: 5px;
    }

    .placement-source {
        grid-column: 2;
        text-align: left;
    }

    .bracket-title {
        font-size: 27px;
    }

    .site-logo {
        max-height: 70px;
    }
}
</style>
</head>

<body>

<header>
    <img src="logo.png" alt="Tournament Logo" class="site-logo">
</header>

<div class="container">

    <h2 class="section-title">GROUP STAGE</h2>

    <div class="groups" id="groups"></div>

    <div class="build-wrap">
        <button class="build-btn" id="buildBtn" onclick="buildBracket()" disabled>
            BUILD BRACKET
        </button>
    </div>

    <section class="qualified-section" id="qualifiedSection" style="display:none;">
        <div class="qualified-card">
            <h2>QUALIFIED TEAMS</h2>

            <div class="qualified-groups" id="qualifiedGroups"></div>
        </div>
    </section>

    <section class="bracket-section" id="bracketSection" style="display:none;">

        <h1 class="bracket-title">DOUBLE ELIMINATION</h1>

        <div class="bracket-area">

            <div class="bracket-column">
                <h2>UPPER BRACKET</h2>
                <div class="match-list" id="upperBracket"></div>
            </div>

            <div class="bracket-column">
                <h2>LOWER BRACKET</h2>
                <div class="match-list" id="lowerBracket"></div>
            </div>

        </div>

        <div class="grand-final">
            <div class="bracket-column">
                <h2>GRAND FINAL</h2>
                <div id="grandFinal"></div>
            </div>
        </div>

        <section class="placement-section">
            <div class="placement-card">

                <h2>🏅 FINAL PLACEMENT</h2>

                <p class="placement-subtitle">
                    Top 12 placement based on the final bracket results.
                </p>

                <div class="placement-list" id="placementList">
                    <div class="placement-empty">
                        Complete the tournament to determine Top 12.
                    </div>
                </div>

            </div>
        </section>

    </section>

</div>

<script>
/* =========================================================
   GROUP DATA
========================================================= */

const defaultGroups = {
    A: ["69D", "7D", "20TS", "MDS", "HST", "ABR"],
    B: ["BOD", "KPK", "302", "TRL", "KKAB", "BBZ"],
    C: ["TR", "KAP", "CBR", "PDAB", "JPJ", "24K"],
    D: ["4P", "BMS", "DRM", "DVX", "ST", "DMF"]
};

let groups = JSON.parse(JSON.stringify(defaultGroups));
let confirmed = {
    A: false,
    B: false,
    C: false,
    D: false
};

let qualified = [];

let matches = {};

let draggedItem = null;

/* =========================================================
   BRACKET DEFINITION
========================================================= */

const bracketDefinition = {

    M1: ["B2", "C3"],
    M2: ["D2", "A3"],
    M3: ["A2", "D3"],
    M4: ["C2", "B3"],

    M5: ["A1", "W1"],
    M6: ["C1", "W2"],
    M7: ["B1", "W3"],
    M8: ["D1", "W4"],

    M9: ["L5", "L4"],
    M10: ["L6", "L3"],
    M11: ["L7", "L2"],
    M12: ["L8", "L1"],

    M13: ["W10", "W9"],
    M14: ["W12", "W11"],

    M15: ["W5", "W6"],
    M16: ["W7", "W8"],

    M17: ["L15", "W14"],
    M18: ["L16", "W13"],

    M19: ["W17", "W18"],

    M20: ["W15", "W16"],

    M21: ["L20", "W19"],

    M22: ["W21", "W20"]
};

const upperMatches = [
    "M1", "M2", "M3", "M4",
    "M5", "M6", "M7", "M8",
    "M15", "M16", "M20"
];

const lowerMatches = [
    "M9", "M10", "M11", "M12",
    "M13", "M14",
    "M17", "M18",
    "M19",
    "M21"
];

const allMatchIds = [
    "M1","M2","M3","M4","M5","M6","M7","M8",
    "M9","M10","M11","M12","M13","M14",
    "M15","M16","M17","M18","M19","M20","M21","M22"
];

/* =========================================================
   GROUP RENDER
========================================================= */

function renderGroups() {

    const container = document.getElementById("groups");

    container.innerHTML = "";

    Object.keys(groups).forEach(group => {

        const card = document.createElement("div");

        card.className =
            "group-card" +
            (confirmed[group] ? " confirmed" : "");

        card.innerHTML = `
            <div class="group-title">GROUP ${group}</div>

            <div
                class="team-list"
                id="group-${group}"
                data-group="${group}"
            ></div>

            <div class="group-actions">
                <button
                    class="confirm-btn"
                    onclick="confirmGroup('${group}')"
                    ${confirmed[group] ? "disabled" : ""}
                >
                    ${confirmed[group] ? "CONFIRMED" : "CONFIRM GROUP"}
                </button>
            </div>
        `;

        container.appendChild(card);

        const list = card.querySelector(".team-list");

        groups[group].forEach((team, index) => {

            const item = document.createElement("div");

            item.className = "team-item";
            item.draggable = !confirmed[group];

            item.dataset.team = team;
            item.dataset.group = group;

            item.innerHTML = `
                <div class="team-rank">${index + 1}</div>
                <div class="team-name">${team}</div>
                ${
                    index < 3
                    ? '<div class="qualified-mark">QUALIFY</div>'
                    : ''
                }
            `;

            if (!confirmed[group]) {

                item.addEventListener("dragstart", e => {
                    draggedItem = item;
                    item.classList.add("dragging");
                    e.dataTransfer.effectAllowed = "move";
                });

                item.addEventListener("dragend", () => {
                    item.classList.remove("dragging");
                    draggedItem = null;
                    updateGroupOrder();
                });

            }

            list.appendChild(item);
        });

        if (!confirmed[group]) {

            list.addEventListener("dragover", e => {
                e.preventDefault();

                if (!draggedItem) return;

                const afterElement = getDragAfterElement(
                    list,
                    e.clientY
                );

                if (afterElement == null) {
                    list.appendChild(draggedItem);
                } else {
                    list.insertBefore(
                        draggedItem,
                        afterElement
                    );
                }
            });

        }
    });

    updateBuildButton();
}

/* =========================================================
   DRAG SUPPORT
========================================================= */

function getDragAfterElement(container, y) {

    const elements = [
        ...container.querySelectorAll(
            ".team-item:not(.dragging)"
        )
    ];

    return elements.reduce(
        (closest, child) => {

            const box =
                child.getBoundingClientRect();

            const offset =
                y - box.top - box.height / 2;

            if (
                offset < 0 &&
                offset > closest.offset
            ) {
                return {
                    offset: offset,
                    element: child
                };
            }

            return closest;

        },
        {
            offset: Number.NEGATIVE_INFINITY
        }
    ).element;
}

function updateGroupOrder() {

    Object.keys(groups).forEach(group => {

        const list =
            document.getElementById(`group-${group}`);

        if (!list) return;

        groups[group] = [
            ...list.querySelectorAll(".team-item")
        ].map(item => item.dataset.team);

    });

    renderGroups();
}

/* =========================================================
   CONFIRM GROUP
========================================================= */

function confirmGroup(group) {

    const list =
        document.getElementById(`group-${group}`);

    groups[group] = [
        ...list.querySelectorAll(".team-item")
    ].map(item => item.dataset.team);

    confirmed[group] = true;

    renderGroups();
    renderQualified();
}

/* =========================================================
   QUALIFIED
========================================================= */

function renderQualified() {

    const container =
        document.getElementById("qualifiedGroups");

    container.innerHTML = "";

    qualified = [];

    Object.keys(groups).forEach(group => {

        const top3 = groups[group].slice(0, 3);

        top3.forEach(team => {
            qualified.push(team);
        });

        const box =
            document.createElement("div");

        box.className = "qualified-group";

        box.innerHTML = `
            <h3>GROUP ${group}</h3>

            ${top3.map((team, index) => `
                <div class="qualified-team">
                    ${index + 1}. ${team}
                </div>
            `).join("")}
        `;

        container.appendChild(box);
    });

    document.getElementById("qualifiedSection").style.display =
        qualified.length === 12 ? "block" : "none";

    updateBuildButton();
}

/* =========================================================
   BUILD BUTTON
========================================================= */

function updateBuildButton() {

    const allConfirmed =
        Object.values(confirmed).every(Boolean);

    document.getElementById("buildBtn").disabled =
        !allConfirmed;
}

/* =========================================================
   BUILD BRACKET
========================================================= */

function buildBracket() {

    if (!Object.values(confirmed).every(Boolean)) {
        return;
    }

    matches = {};

    allMatchIds.forEach(id => {

        matches[id] = {
            id: id,
            team1: null,
            team2: null,
            winner: null,
            completed: false
        };
    });

    resolveAllMatches();

    document.getElementById("bracketSection").style.display =
        "block";

    renderBracket();
    renderPlacements();

    setTimeout(() => {

        const section =
            document.querySelector(".bracket-section");

        const header =
            document.querySelector("header");

        const headerHeight =
            header ? header.offsetHeight : 0;

        const targetY =
            section.getBoundingClientRect().top +
            window.scrollY -
            headerHeight -
            10;

        window.scrollTo({
            top: targetY,
            behavior: "smooth"
        });

    }, 100);
}

/* =========================================================
   RESOLVE REFERENCES
========================================================= */

function resolveReference(ref) {

    if (!ref) return null;

    const groupMatch =
        ref.match(/^([A-D])([1-6])$/);

    if (groupMatch) {

        const group = groupMatch[1];
        const position =
            Number(groupMatch[2]);

        if (!confirmed[group]) {
            return null;
        }

        return groups[group][position - 1] || null;
    }

    const winnerMatch =
        ref.match(/^W(\d+)$/);

    if (winnerMatch) {

        const id =
            "M" + winnerMatch[1];

        return matches[id]?.winner || null;
    }

    const loserMatch =
        ref.match(/^L(\d+)$/);

    if (loserMatch) {

        const id =
            "M" + loserMatch[1];

        return getLoser(id);
    }

    return null;
}

function getLoser(matchId) {

    const match = matches[matchId];

    if (
        !match ||
        !match.completed ||
        !match.winner
    ) {
        return null;
    }

    if (match.team1 === match.winner) {
        return match.team2;
    }

    if (match.team2 === match.winner) {
        return match.team1;
    }

    return null;
}

/* =========================================================
   RESOLVE ALL MATCHES
========================================================= */

function resolveAllMatches() {

    allMatchIds.forEach(id => {

        const match = matches[id];

        const refs = bracketDefinition[id];

        if (!refs) return;

        const newTeam1 =
            resolveReference(refs[0]);

        const newTeam2 =
            resolveReference(refs[1]);

        match.team1 = newTeam1;
        match.team2 = newTeam2;

        if (
            match.completed &&
            (
                !match.winner ||
                (match.winner !== newTeam1 &&
                 match.winner !== newTeam2)
            )
        ) {
            match.winner = null;
            match.completed = false;
        }
    });
}

/* =========================================================
   ACTIVE MATCH
========================================================= */

function getActiveMatch() {

    for (const id of allMatchIds) {

        const match = matches[id];

        if (!match.completed) {
            return match;
        }
    }

    return null;
}

function canPlayMatch(match) {

    const active =
        getActiveMatch();

    return (
        active &&
        active.id === match.id &&
        match.team1 &&
        match.team2
    );
}

/* =========================================================
   CHOOSE WINNER
========================================================= */

function chooseWinner(matchId, team) {

    const match = matches[matchId];

    if (!match) return;

    if (!canPlayMatch(match)) {
        return;
    }

    if (
        team !== match.team1 &&
        team !== match.team2
    ) {
        return;
    }

    match.winner = team;
    match.completed = true;

    resolveAllMatches();

    renderBracket();
    renderPlacements();
}

/* =========================================================
   UNDO
========================================================= */

function undoMatch(matchId) {

    const index =
        allMatchIds.indexOf(matchId);

    if (index === -1) return;

    for (
        let i = index;
        i < allMatchIds.length;
        i++
    ) {

        const id =
            allMatchIds[i];

        matches[id].winner = null;
        matches[id].completed = false;
    }

    resolveAllMatches();

    renderBracket();
    renderPlacements();

    const target =
        document.getElementById(matchId);

    if (target) {
        target.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}

/* =========================================================
   RENDER BRACKET
========================================================= */

function renderBracket() {

    renderMatchList(
        "upperBracket",
        upperMatches
    );

    renderMatchList(
        "lowerBracket",
        lowerMatches
    );

    renderMatchList(
        "grandFinal",
        ["M22"]
    );
}

function renderMatchList(containerId, ids) {

    const container =
        document.getElementById(containerId);

    container.innerHTML = "";

    ids.forEach(id => {

        const match =
            matches[id];

        if (!match) return;

        const active =
            canPlayMatch(match);

        const locked =
            !match.completed && !active;

        const card =
            document.createElement("div");

        card.id = id;

        card.className =
            "match-card" +
            (active ? " active" : "") +
            (match.completed ? " done" : "") +
            (locked ? " locked" : "");

        let status = "LOCKED";

        if (match.completed) {
            status = "DONE";
        } else if (active) {
            status = "YOUR TURN";
        }

        card.innerHTML = `
            <div class="match-header">
                <div class="match-id">${id}</div>
                <div class="match-status">${status}</div>
            </div>

            ${renderTeamSlot(
                match,
                match.team1,
                active
            )}

            ${renderTeamSlot(
                match,
                match.team2,
                active
            )}

            ${
                match.completed
                ? `
                    <button
                        class="undo-btn"
                        onclick="undoMatch('${id}')"
                    >
                        UNDO
                    </button>
                `
                : ""
            }
        `;

        container.appendChild(card);

        if (active) {

            card.querySelectorAll(
                ".match-team[data-team]"
            ).forEach(row => {

                row.addEventListener("click", () => {

                    chooseWinner(
                        id,
                        row.dataset.team
                    );

                });

            });
        }
    });
}

function renderTeamSlot(match, team, active) {

    if (!team) {

        return `
            <div class="match-team disabled">
                <span class="team-slot">
                    —
                </span>
            </div>
        `;
    }

    let className = "match-team";

    if (match.completed) {

        if (team === match.winner) {
            className += " winner";
        } else {
            className += " loser";
        }
    }

    return `
        <div
            class="${className}"
            data-team="${team}"
        >
            <span class="team-slot">
                ${team}
            </span>

            ${
                match.completed &&
                team === match.winner
                ? `<span class="win-label">WIN</span>`
                : ""
            }

            ${
                active
                ? `<span>▶</span>`
                : ""
            }
        </div>
    `;
}

function renderPlacements() {

    const container =
        document.getElementById("placementList");

    if (!container) return;

    const placements =
        getFinalPlacements();

    if (placements.length === 0) {

        container.innerHTML = `
            <div class="placement-empty">
                Complete the tournament to determine Top 12.
            </div>
        `;

        return;
    }

    container.innerHTML =
        placements.map(item => {

            let rankText =
                item.rank === 1
                ? "🥇 1st"
                : item.rank === 2
                ? "🥈 2nd"
                : item.rank === 3
                ? "🥉 3rd"
                : `${item.rank}th`;

            return `
                <div class="placement-row ${item.className}">

                        ${item.team}
