<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABCS Simulator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #08080b;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: #101014;
    border-bottom: 1px solid #292930;

    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    color: #85858e;
    font-size: 13px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 18px;

    background: #292930;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3a3a43;
}

.primary {
    background: #650000;
}

.primary:hover {
    background: #850000;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* =========================
   SECTION
========================= */

section {
    padding: 30px 18px;
}

.section-title {
    max-width: 1500px;
    margin: 0 auto 20px;

    border-left: 4px solid #850000;
    padding-left: 10px;

    font-size: 21px;
    font-weight: bold;
}

/* =========================
   GROUPS
========================= */

.groups {
    max-width: 1500px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

.group {
    background: #121217;
    border: 1px solid #292930;
    border-radius: 12px;
    padding: 15px;
}

.group h3 {
    margin: 0 0 6px;
}

.group-help {
    color: #66666e;
    font-size: 12px;
    margin-bottom: 13px;
}

.team-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

/* =========================
   TEAM
========================= */

.team-item {
    min-height: 47px;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 0 10px;

    background: #1b1b21;
    border: 1px solid #2d2d35;
    border-radius: 8px;

    cursor: grab;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    transition: .15s;
}

.team-item:hover {
    background: #24242b;
}

.team-item.dragging {
    opacity: .35;
}

.team-item.drag-over {
    border-color: #a00000;
    background: #351010;
}

.team-item.locked {
    cursor: default;
}

.handle {
    width: 18px;
    color: #686870;
    text-align: center;
    flex-shrink: 0;
}

.rank {
    width: 24px;
    height: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #292930;
    color: #aaa;

    font-size: 12px;
    font-weight: bold;

    flex-shrink: 0;
}

.team-item:nth-child(-n+3) .rank {
    background: #650000;
    color: white;
}

.team-name {
    font-weight: bold;
    font-size: 14px;
}

.qualify {
    margin-left: auto;

    font-size: 9px;
    font-weight: bold;

    color: #777;
}

.team-item:nth-child(-n+3) .qualify {
    color: #c45c5c;
}

.group-footer {
    margin-top: 12px;
}

.group-status {
    padding: 9px;

    background: #1b1b21;
    border-radius: 7px;

    color: #777;
    text-align: center;

    font-size: 11px;
}

.group-status.confirmed {
    background: #350000;
    color: #e9a4a4;
}

.group-actions {
    display: flex;
    gap: 7px;
    margin-top: 8px;
}

.group-actions button {
    flex: 1;
    font-size: 11px;
}

.confirm-btn {
    background: #650000;
}

.edit-btn {
    background: #292930;
}

/* =========================
   QUALIFIED
========================= */

.qualified {
    max-width: 1500px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

.qualified-box {
    background: #121217;
    border: 1px solid #292930;
    border-radius: 10px;
    padding: 14px;
}

.qualified-box h3 {
    margin: 0 0 10px;
}

.qualified-team {
    padding: 10px;
    margin-bottom: 6px;

    background: #1b1b21;
    border-radius: 7px;

    font-weight: bold;
}

.qualified-team span {
    display: inline-block;
    width: 25px;
    color: #777;
}

.qualified-empty {
    color: #666;
    font-size: 12px;
}

/* =========================
   BRACKET
========================= */

.bracket-section {
    padding-bottom: 60px;
}

.bracket-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;

    padding: 5px 0 25px;

    -webkit-overflow-scrolling: touch;
}

.bracket {
    display: flex;
    gap: 14px;

    min-width: max-content;

    padding: 0 20px;
}

/* Every match gets its own column */

.match-column {
    width: 190px;
    flex-shrink: 0;
}

.match-number {
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #15151a;
    border: 1px solid #292930;
    border-radius: 8px 8px 0 0;

    font-size: 13px;
    font-weight: bold;

    color: #aaa;
}

/* =========================
   MATCH
========================= */

.match {
    border: 1px solid #292930;
    border-top: 0;

    border-radius: 0 0 8px 8px;

    overflow: hidden;

    background: #111116;
}

.match-team {
    min-height: 49px;

    padding: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-top: 1px solid #28282f;

    background: #17171d;

    cursor: pointer;

    transition: .15s;
}

.match-team:hover {
    background: #292930;
}

.match-team:first-child {
    border-top: 0;
}

.match-team.waiting {
    color: #555;
    cursor: default;
}

.match-team.selected {
    background: #650000;
    color: white;
    font-weight: bold;
}

.match-team.eliminated {
    opacity: .32;
    cursor: default;
}

.match-team span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.match-result {
    margin-left: 7px;
    flex-shrink: 0;

    font-size: 9px;
    font-weight: bold;
}

/* =========================
   MATCH TYPE
========================= */

.match-type {
    margin-top: 7px;

    text-align: center;

    font-size: 9px;
    color: #555;
    text-transform: uppercase;
}

/* =========================
   CHAMPION
========================= */

.champion {
    width: calc(100% - 36px);
    max-width: 650px;

    margin: 0 auto 60px;

    padding: 28px;

    background: #121217;

    border: 1px solid #650000;
    border-radius: 14px;

    text-align: center;
}

.champion h2 {
    margin: 0 0 10px;
}

.champion-name {
    font-size: 34px;
    font-weight: bold;

    color: #ffb000;

    word-break: break-word;
}

.champion-info {
    margin-top: 8px;

    color: #666;
    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 1000px) {

    .groups,
    .qualified {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    section {
        padding: 24px 12px;
    }

    .groups,
    .qualified {
        grid-template-columns: 1fr;
    }

    .controls button {
        min-width: 140px;
    }

    .bracket {
        padding: 0 12px;
    }

    .match-column {
        width: 175px;
    }

    .champion {
        width: calc(100% - 24px);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>🏆 4P ABCS Simulator</h1>

    <p>
        24 Teams • 4 Groups • Top 3 • Double Elimination
    </p>

    <div class="controls">

        <button
            id="buildBtn"
            class="primary"
            onclick="buildBracket()"
            disabled>

            BUILD BRACKET

        </button>

        <button onclick="resetAll()">
            RESET
        </button>

    </div>

</header>


<!-- =====================================================
     GROUP STAGE
===================================================== -->

<section>

    <div class="section-title">
        Group Stage
    </div>

    <div
        class="groups"
        id="groups">
    </div>

</section>


<!-- =====================================================
     QUALIFIED
===================================================== -->

<section>

    <div class="section-title">
        Qualified Teams
    </div>

    <div
        class="qualified"
        id="qualified">
    </div>

</section>


<!-- =====================================================
     BRACKET
===================================================== -->

<section class="bracket-section">

    <div class="section-title">
        Double Elimination — M1 → M22
    </div>

    <div class="bracket-scroll">

        <div
            class="bracket"
            id="bracket">
        </div>

    </div>

</section>


<!-- =====================================================
     CHAMPION
===================================================== -->

<div class="champion">

    <h2>🏆 Champion</h2>

    <div
        class="champion-name"
        id="championName">

        —

    </div>

    <div
        class="champion-info"
        id="championInfo">

        Complete the tournament to determine the champion.

    </div>

</div>


<script>

/* =========================================================
   GROUP DATA
========================================================= */

const defaultGroups = {

    A: [
        "69D",
        "7D",
        "20TS",
        "MDS",
        "HST",
        "ABR"
    ],

    B: [
        "BOD",
        "KPK",
        "302",
        "TRL",
        "KKAB",
        "BBZ"
    ],

    C: [
        "TR",
        "KAP",
        "CBR",
        "PDAB",
        "JPJ",
        "24K"
    ],

    D: [
        "4P",
        "BMS",
        "DRM",
        "DVX",
        "S9",
        "DMF"
    ]

};


let groups = clone(defaultGroups);


/* =========================================================
   GROUP CONFIRMATION
========================================================= */

let confirmed = {

    A: false,
    B: false,
    C: false,
    D: false

};


let qualified = {

    A: [],
    B: [],
    C: [],
    D: []

};


/* =========================================================
   DRAG VARIABLES
========================================================= */

let draggedElement = null;

let draggedGroup = null;

let draggedIndex = null;


/* =========================================================
   MATCH DATA
========================================================= */

let matches = {};


/* =========================================================
   EXACT MATCH MAPPING
========================================================= */

const bracketDefinition = {

    M1: {
        a: "B2",
        b: "C3"
    },

    M2: {
        a: "D2",
        b: "A3"
    },

    M3: {
        a: "A2",
        b: "D3"
    },

    M4: {
        a: "C2",
        b: "B3"
    },

    M5: {
        a: "A1",
        b: "W1"
    },

    M6: {
        a: "C1",
        b: "W2"
    },

    M7: {
        a: "B1",
        b: "W3"
    },

    M8: {
        a: "D1",
        b: "W4"
    },

    M9: {
        a: "L5",
        b: "L4"
    },

    M10: {
        a: "L6",
        b: "L3"
    },

    M11: {
        a: "L7",
        b: "L2"
    },

    M12: {
        a: "L8",
        b: "L1"
    },

    M13: {
        a: "W10",
        b: "W9"
    },

    M14: {
        a: "W12",
        b: "W11"
    },

    M15: {
        a: "W5",
        b: "W6"
    },

    M16: {
        a: "W7",
        b: "W8"
    },

    M17: {
        a: "L15",
        b: "W14"
    },

    M18: {
        a: "L16",
        b: "W13"
    },

    M19: {
        a: "W17",
        b: "W18"
    },

    M20: {
        a: "W15",
        b: "W16"
    },

    M21: {
        a: "L20",
        b: "W19"
    },

    M22: {
        a: "W21",
        b: "W20"
    }

};


/* =========================================================
   RENDER GROUPS
========================================================= */

function renderGroups() {

    const container =
        document.getElementById("groups");

    container.innerHTML = "";


    Object.keys(groups).forEach(group => {

        const box =
            document.createElement("div");

        box.className = "group";


        const isConfirmed =
            confirmed[group];


        box.innerHTML = `

            <h3>GROUP ${group}</h3>

            <div class="group-help">

                ${isConfirmed
                    ? "Ranking confirmed."
                    : "Drag teams to set ranking."}

            </div>

            <div
                class="team-list"
                data-group="${group}">
            </div>

            <div class="group-footer">

                <div
                    class="group-status ${isConfirmed ? "confirmed" : ""}"
                    id="status-${group}">

                    ${
                        isConfirmed
                        ? "✓ GROUP CONFIRMED"
                        : "Top 3 not confirmed"
                    }

                </div>

                <div class="group-actions">

                    ${
                        isConfirmed

                        ? `
                            <button
                                class="edit-btn"
                                onclick="editGroup('${group}')">

                                EDIT GROUP

                            </button>
                        `

                        : `
                            <button
                                class="confirm-btn"
                                onclick="confirmGroup('${group}')">

                                CONFIRM GROUP

                            </button>
                        `
                    }

                </div>

            </div>

        `;


        const list =
            box.querySelector(".team-list");


        groups[group].forEach(
            (team, index) => {

                const item =
                    createTeamItem(
                        group,
                        team,
                        index,
                        isConfirmed
                    );


                list.appendChild(item);

            }
        );


        if (!isConfirmed) {

            list.addEventListener(
                "dragover",
                handleDragOver
            );

            list.addEventListener(
                "drop",
                handleDrop
            );

            list.addEventListener(
                "touchmove",
                handleTouchMove,
                {
                    passive: false
                }
            );

            list.addEventListener(
                "touchend",
                handleTouchEnd
            );

        }


        container.appendChild(box);

    });


    updateBuildButton();

}


/* =========================================================
   CREATE TEAM
========================================================= */

function createTeamItem(
    group,
    team,
    index,
    locked
) {

    const item =
        document.createElement("div");


    item.className =
        "team-item" +
        (locked ? " locked" : "");


    item.draggable =
        !locked;


    item.dataset.group =
        group;


    item.dataset.index =
        index;


    item.innerHTML = `

        <div class="handle">
            ${locked ? "" : "☰"}
        </div>

        <div class="rank">
            ${index + 1}
        </div>

        <div class="team-name">
            ${escapeHtml(team)}
        </div>

        <div class="qualify">
            ${index < 3 ? "QUALIFY" : ""}
        </div>

    `;


    if (!locked) {

        item.addEventListener(
            "dragstart",
            handleDragStart
        );

        item.addEventListener(
            "dragend",
            handleDragEnd
        );

        item.addEventListener(
            "touchstart",
            handleTouchStart,
            {
                passive: true
            }
        );

    }


    return item;

}


/* =========================================================
   DESKTOP DRAG
========================================================= */

function handleDragStart(event) {

    draggedElement =
        event.currentTarget;

    draggedGroup =
        draggedElement.dataset.group;

    draggedIndex =
        Number(
            draggedElement.dataset.index
        );


    draggedElement.classList.add(
        "dragging"
    );

}


function handleDragEnd() {

    if (draggedElement) {

        draggedElement.classList.remove(
            "dragging"
        );

    }


    document
        .querySelectorAll(".drag-over")
        .forEach(element => {

            element.classList.remove(
                "drag-over"
            );

        });


    draggedElement = null;
    draggedGroup = null;
    draggedIndex = null;

}


function handleDragOver(event) {

    event.preventDefault();


    if (!draggedElement) {
        return;
    }


    const target =
        event.target.closest(
            ".team-item"
        );


    if (!target) {
        return;
    }


    if (
        target.dataset.group !==
        draggedGroup
    ) {

        return;

    }


    document
        .querySelectorAll(".drag-over")
        .forEach(element => {

            element.classList.remove(
                "drag-over"
            );

        });


    target.classList.add(
        "drag-over"
    );

}


function handleDrop(event) {

    event.preventDefault();


    const target =
        event.target.closest(
            ".team-item"
        );


    if (!target) {
        return;
    }


    if (
        target.dataset.group !==
        draggedGroup
    ) {

        return;

    }


    const targetIndex =
        Number(
            target.dataset.index
        );


    moveTeam(
        draggedGroup,
        draggedIndex,
        targetIndex
    );

}


/* =========================================================
   TOUCH DRAG
========================================================= */

function handleTouchStart(event) {

    draggedElement =
        event.currentTarget;

    draggedGroup =
        draggedElement.dataset.group;

    draggedIndex =
        Number(
            draggedElement.dataset.index
        );


    draggedElement.classList.add(
        "dragging"
    );

}


function handleTouchMove(event) {

    if (!draggedElement) {
        return;
    }


    event.preventDefault();


    const touch =
        event.touches[0];


    const element =
        document.elementFromPoint(
            touch.clientX,
            touch.clientY
        );


    const target =
        element?.closest(
            ".team-item"
        );


    document
        .querySelectorAll(".drag-over")
        .forEach(element => {

            element.classList.remove(
                "drag-over"
            );

        });


    if (
        target &&
        target.dataset.group ===
        draggedGroup &&
        target !== draggedElement
    ) {

        target.classList.add(
            "drag-over"
        );

    }

}


function handleTouchEnd(event) {

    if (!draggedElement) {
        return;
    }


    const touch =
        event.changedTouches[0];


    const element =
        document.elementFromPoint(
            touch.clientX,
            touch.clientY
        );


    const target =
        element?.closest(
            ".team-item"
        );


    if (
        target &&
        target.dataset.group ===
        draggedGroup &&
        target !== draggedElement
    ) {

        const targetIndex =
            Number(
                target.dataset.index
            );


        moveTeam(
            draggedGroup,
            draggedIndex,
            targetIndex
        );

    }


    if (draggedElement) {

        draggedElement.classList.remove(
            "dragging"
        );

    }


    document
        .querySelectorAll(".drag-over")
        .forEach(element => {

            element.classList.remove(
                "drag-over"
            );

        });


    draggedElement = null;
    draggedGroup = null;
    draggedIndex = null;

}


/* =========================================================
   MOVE TEAM
========================================================= */

function moveTeam(
    group,
    fromIndex,
    toIndex
) {

    if (confirmed[group]) {
        return;
    }


    const list =
        groups[group];


    const moved =
        list.splice(
            fromIndex,
            1
        )[0];


    list.splice(
        toIndex,
        0,
        moved
    );


    renderGroups();

}


/* =========================================================
   CONFIRM GROUP
========================================================= */

function confirmGroup(group) {

    if (confirmed[group]) {
        return;
    }


    qualified[group] =
        groups[group].slice(0, 3);


    confirmed[group] = true;


    renderGroups();

    renderQualified();


    /*
       If bracket already exists,
       rebuild because ranking changed.
    */

    if (
        Object.keys(matches).length > 0
    ) {

        initializeMatches();

        resolveAllMatches();

        renderBracket();

        updateChampion();

    }

}


/* =========================================================
   EDIT GROUP
========================================================= */

function editGroup(group) {

    confirmed[group] = false;

    qualified[group] = [];


    /*
       Changing a group after bracket
       exists invalidates predictions.
    */

    matches = {};


    document.getElementById(
        "bracket"
    ).innerHTML = "";


    document.getElementById(
        "championName"
    ).innerText = "—";


    document.getElementById(
        "championInfo"
    ).innerText =
        "Confirm all groups to rebuild the tournament.";


    renderGroups();

    renderQualified();

}


/* =========================================================
   QUALIFIED
========================================================= */

function renderQualified() {

    const container =
        document.getElementById(
            "qualified"
        );


    container.innerHTML = "";


    Object.keys(qualified).forEach(group => {

        const box =
            document.createElement("div");


        box.className =
            "qualified-box";


        box.innerHTML =
            `<h3>GROUP ${group}</h3>`;


        if (
            qualified[group].length !== 3
        ) {

            box.innerHTML += `

                <div class="qualified-empty">

                    Waiting for Group ${group}
                    confirmation.

                </div>

            `;

        } else {

            qualified[group].forEach(
                (team, index) => {

                    box.innerHTML += `

                        <div class="qualified-team">

                            <span>
                                ${index + 1}.
                            </span>

                            ${escapeHtml(team)}

                        </div>

                    `;

                }
            );

        }


        container.appendChild(box);

    });

}


/* =========================================================
   BUILD BUTTON
========================================================= */

function updateBuildButton() {

    const allConfirmed =
        Object.values(
            confirmed
        ).every(Boolean);


    document.getElementById(
        "buildBtn"
    ).disabled =
        !allConfirmed;

}


/* =========================================================
   BUILD BRACKET
========================================================= */

function buildBracket() {

    if (
        !Object.values(
            confirmed
        ).every(Boolean)
    ) {

        alert(
            "Confirm all 4 groups first."
        );

        return;

    }


    initializeMatches();

    resolveAllMatches();

    renderBracket();

    updateChampion();


    setTimeout(() => {

        document
            .querySelector(
                ".bracket-section"
            )
            .scrollIntoView({
                behavior: "smooth"
            });

    }, 100);

}


/* =========================================================
   INITIALIZE MATCHES
========================================================= */

function initializeMatches() {

    matches = {};


    for (
        let i = 1;
        i <= 22;
        i++
    ) {

        matches[
            "M" + i
        ] = {

            a: null,

            b: null,

            winner: null

        };

    }

}


/* =========================================================
   RESOLVE REFERENCE
========================================================= */

function resolveReference(ref) {

    if (!ref) {
        return null;
    }


    /*
       Group position
    */

    if (
        /^[ABCD][123]$/.test(ref)
    ) {

        const group =
            ref[0];


        const position =
            Number(
                ref[1]
            ) - 1;


        return (
            qualified[group]?.[position]
            || null
        );

    }


    /*
       Winner reference
    */

    if (
        ref.startsWith("W")
    ) {

        const matchId =
            "M" +
            ref.substring(1);


        return (
            matches[matchId]?.winner
            || null
        );

    }


    /*
       Loser reference
    */

    if (
        ref.startsWith("L")
    ) {

        const matchId =
            "M" +
            ref.substring(1);


        const match =
            matches[matchId];


        if (!match) {
            return null;
        }


        if (!match.winner) {
            return null;
        }


        if (
            match.a ===
            match.winner
        ) {

            return match.b;

        }


        if (
            match.b ===
            match.winner
        ) {

            return match.a;

        }


        return null;

    }


    return null;

}


/* =========================================================
   RESOLVE ALL
========================================================= */

function resolveAllMatches() {

    for (
        let pass = 0;
        pass < 50;
        pass++
    ) {

        let changed = false;


        for (
            let i = 1;
            i <= 22;
            i++
        ) {

            const matchId =
                "M" + i;


            const definition =
                bracketDefinition[
                    matchId
                ];


            if (!definition) {
                continue;
            }


            const newA =
                resolveReference(
                    definition.a
                );


            const newB =
                resolveReference(
                    definition.b
                );


            const match =
                matches[matchId];


            if (
                match.a !== newA ||
                match.b !== newB
            ) {

                match.a = newA;

                match.b = newB;


                /*
                   Remove winner if the
                   participant is no longer
                   valid.
                */

                if (
                    match.winner !== match.a &&
                    match.winner !== match.b
                ) {

                    match.winner = null;

                }


                changed = true;

            }

        }


        if (!changed) {
            break;
        }

    }

}


/* =========================================================
   SELECT WINNER
========================================================= */

function chooseWinner(
    matchId,
    team
) {

    const match =
        matches[matchId];


    if (!match) {
        return;
    }


    if (
        team !== match.a &&
        team !== match.b
    ) {

        return;

    }


    match.winner =
        team;


    /*
       Recalculate complete bracket.
    */

    resolveAllMatches();

    renderBracket();

    updateChampion();

}


/* =========================================================
   RENDER BRACKET
========================================================= */

function renderBracket() {

    resolveAllMatches();


    const container =
        document.getElementById(
            "bracket"
        );


    container.innerHTML = "";


    /*
       IMPORTANT:
       Strict M1 → M22 order.
    */

    for (
        let i = 1;
        i <= 22;
        i++
    ) {

        const matchId =
            "M" + i;


        const column =
            document.createElement(
                "div"
            );


        column.className =
            "match-column";


        column.innerHTML = `

            <div class="match-number">
                ${matchId}
            </div>

            <div class="match">

                ${createMatchTeamHtml(
                    matchId,
                    matches[matchId].a
                )}

                ${createMatchTeamHtml(
                    matchId,
                    matches[matchId].b
                )}

            </div>

            <div class="match-type">

                ${getMatchType(matchId)}

            </div>

        `;


        /*
           Add click handlers
        */

        const teamElements =
            column.querySelectorAll(
                ".match-team"
            );


        teamElements.forEach(element => {

            const team =
                element.dataset.team;


            if (
                team &&
                element.dataset.available ===
                "true"
            ) {

                element.addEventListener(
                    "click",
                    () => {

                        chooseWinner(
                            matchId,
                            team
                        );

                    }
                );

            }

        });


        container.appendChild(
            column
        );

    }

}


/* =========================================================
   MATCH TEAM HTML
========================================================= */

function createMatchTeamHtml(
    matchId,
    team
) {

    const match =
        matches[matchId];


    if (!team) {

        return `

            <div class="match-team waiting">

                <span>
                    Waiting...
                </span>

            </div>

        `;

    }


    /*
       Winner selected
    */

    if (
        match.winner === team
    ) {

        return `

            <div
                class="match-team selected"
                data-team="${escapeAttribute(team)}"
                data-available="false">

                <span>
                    ${escapeHtml(team)}
                </span>

                <span class="match-result">
                    ✓
                </span>

            </div>

        `;

    }


    /*
       Someone else won this match.
       This team is eliminated.
    */

    if (
        match.winner &&
        match.winner !== team
    ) {

        return `

            <div
                class="match-team eliminated"
                data-team="${escapeAttribute(team)}"
                data-available="false">

                <span>
                    ${escapeHtml(team)}
                </span>

                <span class="match-result">
                    ✕
                </span>

            </div>

        `;

    }


    /*
       No winner yet.
       Team is clickable.
    */

    return `

        <div
            class="match-team"
            data-team="${escapeAttribute(team)}"
            data-available="true">

            <span>
                ${escapeHtml(team)}
            </span>

        </div>

    `;

}


/* =========================================================
   MATCH TYPE
========================================================= */

function getMatchType(matchId) {

    const number =
        Number(
            matchId.substring(1)
        );


    if (number <= 8) {
        return "Upper Bracket";
    }


    if (number <= 19) {
        return "Lower Bracket";
    }


    if (number === 20) {
        return "Upper Final";
    }


    if (number === 21) {
        return "Lower Final";
    }


    return "Grand Final";

}


/* =========================================================
   CHAMPION
========================================================= */

function updateChampion() {

    const final =
        matches["M22"];


    const name =
        document.getElementById(
            "championName"
        );


    const info =
        document.getElementById(
            "championInfo"
        );


    if (
        final &&
        final.winner
    ) {

        name.innerText =
            final.winner;


        info.innerText =
            "🏆 Tournament Champion";

    } else {

        name.innerText =
            "—";


        info.innerText =
            "Click a team in each match to predict the winner.";

    }

}


/* =========================================================
   RESET
========================================================= */

function resetAll() {

    if (
        !confirm(
            "Reset all group rankings and tournament predictions?"
        )
    ) {

        return;

    }


    groups =
        clone(defaultGroups);


    confirmed = {

        A: false,
        B: false,
        C: false,
        D: false

    };


    qualified = {

        A: [],
        B: [],
        C: [],
        D: []

    };


    matches = {};


    renderGroups();

    renderQualified();


    document.getElementById(
        "bracket"
    ).innerHTML = "";


    document.getElementById(
        "championName"
    ).innerText = "—";


    document.getElementById(
        "championInfo"
    ).innerText =
        "Complete the tournament to determine the champion.";

}


/* =========================================================
   HELPERS
========================================================= */

function clone(object) {

    return JSON.parse(
        JSON.stringify(object)
    );

}


function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   START
========================================================= */

renderGroups();

renderQualified();

</script>
