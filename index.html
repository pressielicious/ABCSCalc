<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tier Craft Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #1a1d25;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #4caf50;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #45a049;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: #11141b;
      border-radius: 10px;
    }

    .tier {
      margin-bottom: 10px;
      padding: 10px;
      background: #222634;
      border-radius: 8px;
    }

    .title {
      font-weight: bold;
      color: #00d4ff;
    }

    .item {
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Tier Craft Calculator</h1>

  <label>Select Item (Tier 4)</label>
  <select id="item">
    <option value="Rifle">Rifle</option>
    <option value="RifleAmmo">Rifle Ammo</option>
    <option value="SMG">SMG</option>
    <option value="SMGAmmo">SMG Ammo</option>
    <option value="Pistol">Pistol</option>
    <option value="PistolAmmo">Pistol Ammo</option>
    <option value="VestArmor">Vest Armor</option>
  </select>

  <label>Quantity</label>
  <input type="number" id="qty" value="1" min="1">

  <button onclick="calculate()">Calculate</button>

  <div class="box" id="output"></div>
</div>

<script>
const recipes = {

  // TIER 3 -> TIER 4
  Rifle: { Joint:7, Heroin:7, Iron:20, Kayu:20 },
  RifleAmmo: { Besi:5, Kayu:5, Cocaine:1, Morphine:1 },
  SMG: { Getah:20, Keluli:20, Cocaine:5, Heroin:5 },
  SMGAmmo: { Getah:5, Keluli:5, Cocaine:1, Morphine:1 },
  Pistol: { Tembaga:20, Kain:20, Morphine:3, Heroin:3 },
  PistolAmmo: { Tembaga:5, Kain:5, Cocaine:1, Morphine:1 },
  VestArmor: { Joint:2, Cocaine:2, Morphine:1, Heroin:1 },

  // TIER 3
  Joint: { Weedbud:5, CokePure:1, Plastic:1 },
  Morphine: { Weedbud:5, Crack:1, Plastic:1 },
  Heroin: { Crack:1, AmmoniumChlorite:1, Plastic:1 },
  Cocaine: { CokePure:1, AmmoniumChlorite:1, Plastic:1 },

  // TIER 2
  AmmoniumChlorite: { HydrochloricAcid:5, Water:1, Plastic:1 },
  Crack: { Poppy:5, Water:1, Plastic:1 },
  CokePure: { CokeLeaf:5, Water:1, Plastic:1 }
};

function expand(item, qty, result = {}) {
  if (!recipes[item]) {
    result[item] = (result[item] || 0) + qty;
    return result;
  }

  for (let mat in recipes[item]) {
    expand(mat, qty * recipes[item][mat], result);
  }

  return result;
}

function calculate() {
  const item = document.getElementById("item").value;
  const qty = parseInt(document.getElementById("qty").value);

  const raw = expand(item, qty);

  let html = `<div class="tier"><div class="title">RAW MATERIALS REQUIRED</div>`;

  for (let key in raw) {
    html += `<div class="item">${key} : ${raw[key]}</div>`;
  }

  html += `</div>`;

  document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
