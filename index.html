<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Craft Calculator</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0d12;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #151925;
  padding: 15px;
  border-radius: 10px;
}

h2 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111522;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.btn {
  background: #00c2ff;
  border: none;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.qty {
  min-width: 30px;
  text-align: center;
}

button.calc {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #00c2ff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.box {
  background: #111522;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.title {
  color: #00c2ff;
  font-weight: bold;
  margin-bottom: 5px;
}

.itemLine {
  padding: 3px 0;
  border-bottom: 1px solid #1f2635;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>CRAFT CALCULATOR</h2>

    <div class="grid">

      <div>
        <div class="item">
          Rifle
          <div>
            <button class="btn" onclick="change('Rifle',-1)">-</button>
            <span id="Rifle" class="qty">0</span>
            <button class="btn" onclick="change('Rifle',1)">+</button>
          </div>
        </div>

        <div class="item">
          SMG
          <div>
            <button class="btn" onclick="change('SMG',-1)">-</button>
            <span id="SMG" class="qty">0</span>
            <button class="btn" onclick="change('SMG',1)">+</button>
          </div>
        </div>

        <div class="item">
          Pistol
          <div>
            <button class="btn" onclick="change('Pistol',-1)">-</button>
            <span id="Pistol" class="qty">0</span>
            <button class="btn" onclick="change('Pistol',1)">+</button>
          </div>
        </div>

        <div class="item">
          Vest Armor
          <div>
            <button class="btn" onclick="change('VestArmor',-1)">-</button>
            <span id="VestArmor" class="qty">0</span>
            <button class="btn" onclick="change('VestArmor',1)">+</button>
          </div>
        </div>

      </div>

      <div>
        <button class="calc" onclick="calc()">CALCULATE</button>

        <div id="out"></div>
      </div>

    </div>

  </div>

</div>

<script>
const recipes = {

Rifle: { Joint:7, Heroin:7, Iron:20, Kayu:20 },
SMG: { Getah:20, Keluli:20, Cocaine:5, Heroin:5 },
Pistol: { Tembaga:20, Kain:20, Morphine:3, Heroin:3 },
VestArmor: { Joint:2, Cocaine:2, Morphine:1, Heroin:1 },

Joint: { Weedbud:5, CokePure:1, Plastic:1 },
Morphine: { Weedbud:5, Crack:1, Plastic:1 },
Heroin: { Crack:1, AmmoniumChlorite:1, Plastic:1 },
Cocaine: { CokePure:1, AmmoniumChlorite:1, Plastic:1 },

AmmoniumChlorite: { HydrochloricAcid:5, Water:1, Plastic:1 },
Crack: { Poppy:5, Water:1, Plastic:1 },
CokePure: { CokeLeaf:5, Water:1, Plastic:1 }

};

function change(id, val) {
  let el = document.getElementById(id);
  let current = parseInt(el.innerText);
  current = Math.max(0, current + val);
  el.innerText = current;
}

function expand(item, qty, out = {}) {
  if (!recipes[item]) {
    out[item] = (out[item] || 0) + qty;
    return out;
  }

  for (let k in recipes[item]) {
    expand(k, qty * recipes[item][k], out);
  }

  return out;
}

function tier(item) {
  if (["HydrochloricAcid","Poppy","CokeLeaf","Weedbud","Water","Plastic","Iron","Kayu","Getah","Keluli","Tembaga","Kain","Besi"].includes(item)) return 1;
  if (["AmmoniumChlorite","Crack","CokePure"].includes(item)) return 2;
  if (["Joint","Morphine","Heroin","Cocaine"].includes(item)) return 3;
  return 4;
}

function calc() {
  let final = {};

  for (let id of ["Rifle","SMG","Pistol","VestArmor"]) {
    let qty = parseInt(document.getElementById(id).innerText);

    if (qty > 0) {
      let data = expand(id, qty);
      for (let k in data) {
        final[k] = (final[k] || 0) + data[k];
      }
    }
  }

  let t1={},t2={},t3={},t4={};

  for (let k in final) {
    let t = tier(k);
    if (t===1) t1[k]=final[k];
    if (t===2) t2[k]=final[k];
    if (t===3) t3[k]=final[k];
    if (t===4) t4[k]=final[k];
  }

  document.getElementById("out").innerHTML = `

  <div class="box">
    <div class="title">TIER 4</div>
    ${Object.keys(t4).map(i=>`<div class="itemLine">${i} x${t4[i]}</div>`).join("") || "-"}
  </div>

  <div class="box">
    <div class="title">TIER 3</div>
    ${Object.keys(t3).map(i=>`<div class="itemLine">${i} x${t3[i]}</div>`).join("") || "-"}
  </div>

  <div class="box">
    <div class="title">TIER 2</div>
    ${Object.keys(t2).map(i=>`<div class="itemLine">${i} x${t2[i]}</div>`).join("") || "-"}
  </div>

  <div class="box">
    <div class="title">TIER 1 RAW</div>
    ${Object.keys(t1).map(i=>`<div class="itemLine">${i} x${t1[i]}</div>`).join("") || "-"}
  </div>

  `;
}
</script>

</body>
</html>
