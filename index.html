<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ABD Full Craft System</title>

<style>
:root {
  --bg:#0d0d10;
  --card:#1a1a1f;
  --border:#333;
  --text:#e6e6eb;
  --muted:#a0a0ab;
  --accent:#5c6bc0;
  --accent-hover:#3f51b5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}
h1{text-align:center;margin-bottom:20px}
h2{margin-bottom:10px;font-size:1.1rem}
.box{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.input-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column}
input{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#111;
  color:var(--text);
}
button{
  margin-top:12px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:.9rem}
th{color:var(--muted);background:#111}
</style>
</head>

<body>

<h1>FULL CRAFT SYSTEM</h1>

<div class="box">
  <h2>Input Demand</h2>
  <div class="input-grid">
    <label>Vest Armor<input id="vest" type="number" value="0"></label>
    <label>Ammo (Rifle + SMG)<input id="ammo" type="number" value="0"></label>
    <label>Pistol Package<input id="pistol" type="number" value="0"></label>
  </div>
  <button onclick="calc()">Kira Full Craft</button>
</div>

<div class="box">
<h2>PRODUCT TOTAL</h2>
<table><tbody id="product"></tbody></table>
</div>

<div class="box">
<h2>TIER 4</h2>
<table><tbody id="t4"></tbody></table>
</div>

<div class="box">
<h2>TIER 3</h2>
<table><tbody id="t3"></tbody></table>
</div>

<div class="box">
<h2>RAW MATERIALS (FINAL FARM LIST)</h2>
<table><tbody id="raw"></tbody></table>
</div>

<script>

function add(obj,k,v){obj[k]=(obj[k]||0)+v}

// expand Tier3 → Tier4
function expandT3(t3){
  const t4 = {}

  add(t4,'joint', t3.purecoke * 1)
  add(t4,'morphine', t3.crack * 1)
  add(t4,'heroin', t3.crack * 1)
  add(t4,'cocaine', t3.ammonium * 1)

  return t4
}

// expand Tier4 → Products
function calc() {

  const vest = +document.getElementById('vest').value
  const ammo = +document.getElementById('ammo').value
  const pistol = +document.getElementById('pistol').value

  // ================= PRODUCT DEMAND =================
  const product = {
    vest_armor: vest,
    rifle_ammo: ammo,
    smg_ammo: ammo,
    rifle: pistol,
    smg: pistol,
    pistol: pistol,
    pistol_ammo: pistol
  }

  // ================= TIER 4 DIRECT FROM PRODUCT =================
  const t4 = {}

  // Vest Armor
  add(t4,'joint', vest * 2)
  add(t4,'cocaine', vest * 2)
  add(t4,'morphine', vest * 1)
  add(t4,'heroin', vest * 1)

  // Rifle Ammo
  add(t4,'cocaine', ammo * 1)
  add(t4,'morphine', ammo * 1)

  // SMG Ammo
  add(t4,'cocaine', ammo * 1)
  add(t4,'morphine', ammo * 1)

  // Rifle
  add(t4,'joint', pistol * 7)
  add(t4,'heroin', pistol * 7)

  // SMG
  add(t4,'cocaine', pistol * 5)
  add(t4,'heroin', pistol * 5)

  // Pistol
  add(t4,'morphine', pistol * 3)
  add(t4,'heroin', pistol * 3)

  // Pistol Ammo
  add(t4,'cocaine', pistol * 1)
  add(t4,'morphine', pistol * 1)

  // ================= TIER 3 =================
  const t3 = {
    ammonium: t4.heroin + t4.cocaine,
    crack: t4.morphine + t4.heroin,
    purecoke: t4.joint + t4.cocaine
  }

  // ================= RAW EXPANSION =================
  const raw = {
    iron: pistol * 20,
    kayu: pistol * 20,

    getah: pistol * 20 + ammo * 5,
    keluli: pistol * 20 + ammo * 5,

    tembaga: pistol * 20,
    kain: pistol * 20,

    weedbud: (t4.joint + t4.morphine) * 5,
    poppy: t3.crack * 5,
    cokeleaf: t3.purecoke * 5,
    acid: t3.ammonium * 5,

    water: t3.ammonium + t3.crack + t3.purecoke,

    plastic:
      t4.joint +
      t4.cocaine +
      t4.morphine +
      t4.heroin
  }

  render('product',product)
  render('t4',t4)
  render('t3',t3)
  render('raw',raw)
}

function render(id,obj){
  const el=document.getElementById(id)
  el.innerHTML=''
  for(const k in obj){
    el.innerHTML+=`<tr><td>${k.toUpperCase()}</td><td>${obj[k]}</td></tr>`
  }
}

</script>

</body>
</html>
