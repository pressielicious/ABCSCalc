<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Craft Calculator</title>
<style>
  body {
    font-family: Arial;
    background: #0f0f0f;
    color: #fff;
    padding: 20px;
  }

  h2 { margin-bottom: 10px; }

  select, input, button {
    padding: 8px;
    margin: 5px;
  }

  .box {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 10px;
    max-width: 600px;
  }

  .result {
    margin-top: 20px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
    white-space: pre-line;
  }
</style>
</head>
<body>

<div class="box">
  <h2>CRAFT CALCULATOR</h2>

  <label>Item:</label>
  <select id="item">
    <option>Rifle</option>
    <option>Rifle Ammo</option>
    <option>SMG</option>
    <option>SMG Ammo</option>
    <option>Pistol</option>
    <option>Pistol Ammo</option>
    <option>Vest Armor</option>
    <option>Joint</option>
    <option>Morphine</option>
    <option>Heroin</option>
    <option>Cocaine</option>
  </select>

  <br>

  <label>Amount:</label>
  <input type="number" id="qty" value="1" min="1">

  <br>

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="output"></div>
</div>

<script>
const recipes = {
  "Ammonium Chlorite": {"Hydrochloric Acid":5, "Water":1, "Plastic":1},
  "Crack": {"Poppy":5, "Water":1, "Plastic":1},
  "Coke Pure": {"Coke Leaf":5, "Water":1, "Plastic":1},

  "Joint": {"Weedbud":5, "Coke Pure":1, "Plastic":1},
  "Morphine": {"Weedbud":5, "Crack":1, "Plastic":1},
  "Heroin": {"Crack":1, "Ammonium Chlorite":1, "Plastic":1},
  "Cocaine": {"Coke Pure":1, "Ammonium Chlorite":1, "Plastic":1},

  "Rifle": {"Iron":20, "Kayu":20, "Joint":7, "Heroin":7},
  "Rifle Ammo": {"Besi":5, "Kayu":5, "Cocaine":1, "Morphine":1},

  "SMG": {"Getah":20, "Keluli":20, "Cocaine":5, "Heroin":5},
  "SMG Ammo": {"Getah":5, "Keluli":5, "Cocaine":1, "Morphine":1},

  "Pistol": {"Tembaga":20, "Kain":20, "Morphine":3, "Heroin":3},
  "Pistol Ammo": {"Tembaga":5, "Kain":5, "Cocaine":1, "Morphine":1},

  "Vest Armor": {"Joint":2, "Cocaine":2, "Morphine":1, "Heroin":1}
};

function resolve(item, qty, output) {
  if (!recipes[item]) {
    output[item] = (output[item] || 0) + qty;
    return;
  }

  const req = recipes[item];
  for (let key in req) {
    resolve(key, req[key] * qty, output);
  }
}

function calculate() {
  const item = document.getElementById("item").value;
  const qty = parseInt(document.getElementById("qty").value);

  let result = {};

  resolve(item, qty, result);

  let text = "RAW MATERIALS NEEDED:\n\n";
  for (let k in result) {
    text += `${k}: ${result[k]}\n`;
  }

  document.getElementById("output").innerText = text;
}
</script>

</body>
</html>
