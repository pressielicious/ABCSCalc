<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Craft Calculator</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: #fff;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.header {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 15px;
}

.card {
  background: #151925;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  margin-top: 8px;
  background: #0f131c;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #00c2ff;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00a6d6;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.tierBox {
  background: #111522;
  padding: 10px;
  border-radius: 10px;
}

.tierTitle {
  font-weight: bold;
  margin-bottom: 8px;
  color: #00c2ff;
}

.item {
  padding: 4px 0;
  border-bottom: 1px solid #1f2635;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">CRAFT CALCULATOR</div>

  <div class="card">
    <label>Item Name (exact)</label>
    <input id="item" placeholder="Rifle / SMG / Pistol / VestArmor / RifleAmmo..." />

    <label>Quantity</label>
    <input id="qty" type="number" value="1" min="1" />

    <button onclick="calc()">CALCULATE</button>
  </div>

  <div id="output"></div>

</div>

<script>
const recipes = {

  // Tier 4
  Rifle: { Joint:7, Heroin:7, Iron:20, Kayu:20 },
  SMG: { Getah:20, Keluli:20, Cocaine:5, Heroin:5 },
  Pistol: { Tembaga:20, Kain:20, Morphine:3, Heroin:3 },
  VestArmor: { Joint:2, Cocaine:2, Morphine:1, Heroin:1 },
  RifleAmmo: { Besi:5, Kayu:5, Cocaine:1, Morphine:1 },
  SMGAmmo: { Getah:5, Keluli:5, Cocaine:1, Morphine:1 },
  PistolAmmo: { Tembaga:5, Kain:5, Cocaine:1, Morphine:1 },

  // Tier 3
  Joint: { Weedbud:5, CokePure:1, Plastic:1 },
  Morphine: { Weedbud:5, Crack:1, Plastic:1 },
  Heroin: { Crack:1, AmmoniumChlorite:1, Plastic:1 },
  Cocaine: { CokePure:1, AmmoniumChlorite:1, Plastic:1 },

  // Tier 2
  AmmoniumChlorite: { HydrochloricAcid:5, Water:1, Plastic:1 },
  Crack: { Poppy:5, Water:1, Plastic:1 },
  CokePure: { CokeLeaf:5, Water:1, Plastic:1 }
};

function expand(item, qty, result = {}) {
  if (!recipes[item]) {
    result[item] = (result[item] || 0) + qty;
    return result;
  }

  for (let k in recipes[item]) {
    expand(k, qty * recipes[item][k], result);
  }

  return result;
}

function tier(item) {
  if (["HydrochloricAcid","Poppy","CokeLeaf","Weedbud","Water","Plastic","Iron","Kayu","Getah","Keluli","Tembaga","Kain","Besi"].includes(item)) return 1;
  if (["AmmoniumChlorite","Crack","CokePure"].includes(item)) return 2;
  if (["Joint","Morphine","Heroin","Cocaine"].includes(item)) return 3;
  return 4;
}

function calc() {
  let item = document.getElementById("item").value.trim();
  let qty = parseInt(document.getElementById("qty").value);

  let raw = expand(item, qty);

  let t1 = {}, t2 = {}, t3 = {}, t4 = {};

  for (let k in raw) {
    let t = tier(k);
    if (t === 1) t1[k] = raw[k];
    if (t === 2) t2[k] = raw[k];
    if (t === 3) t3[k] = raw[k];
    if (t === 4) t4[k] = raw[k];
  }

  document.getElementById("output").innerHTML = `
    <div class="grid">

      <div class="tierBox">
        <div class="tierTitle">TIER 4</div>
        ${Object.keys(t4).map(i=>`<div class="item">${i} : ${t4[i]}</div>`).join("") || "<div class='item'>-</div>"}
      </div>

      <div class="tierBox">
        <div class="tierTitle">TIER 3</div>
        ${Object.keys(t3).map(i=>`<div class="item">${i} : ${t3[i]}</div>`).join("") || "<div class='item'>-</div>"}
      </div>

      <div class="tierBox">
        <div class="tierTitle">TIER 2</div>
        ${Object.keys(t2).map(i=>`<div class="item">${i} : ${t2[i]}</div>`).join("") || "<div class='item'>-</div>"}
      </div>

      <div class="tierBox">
        <div class="tierTitle">TIER 1 (RAW)</div>
        ${Object.keys(t1).map(i=>`<div class="item">${i} : ${t1[i]}</div>`).join("") || "<div class='item'>-</div>"}
      </div>

    </div>
  `;
}
</script>

</body>
</html>
